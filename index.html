<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>记账小管家</title>
<!-- No external JS dependencies, pure native implementation -->
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: #f5f5f7;
  color: #1d1d1f;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ===== App Container ===== */
.app {
  max-width: 480px; margin: 0 auto; height: 100%;
  display: flex; flex-direction: column;
  background: #fff; position: relative;
}

/* ===== Header ===== */
.header {
  padding: 16px 20px 12px;
  background: #fff; border-bottom: 1px solid #e9e9eb;
  flex-shrink: 0;
}
.header-top {
  display: flex; justify-content: space-between; align-items: center;
}
.header h1 {
  font-size: 20px; font-weight: 700; color: #1d1d1f;
}
.header-month {
  font-size: 13px; color: #8e8e93;
  background: #f2f2f7; border-radius: 16px;
  padding: 4px 12px;
}
.header-summary {
  display: flex; gap: 20px; margin-top: 8px;
}
.header-summary .stat-item {
  flex: 1;
}
.header-summary .stat-label {
  font-size: 11px; color: #8e8e93; margin-bottom: 2px;
}
.header-summary .stat-value {
  font-size: 22px; font-weight: 700; color: #1d1d1f;
}
.header-summary .stat-value.warn { color: #ff3b30; }
.header-summary .stat-sub {
  font-size: 12px; color: #8e8e93; margin-top: 1px;
}
.header-summary .stat-sub.up { color: #ff3b30; }
.header-summary .stat-sub.down { color: #34c759; }

/* ===== Main Content Area ===== */
.main {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}

/* ===== Page Containers ===== */
.page { display: none; padding: 16px 20px 8px; }
.page.active { display: block; }

/* ===== Input Area (Page 1) ===== */
.input-area {
  background: #f2f2f7; border-radius: 16px; padding: 16px; margin-bottom: 16px;
}
.input-row {
  display: flex; align-items: center; gap: 12px;
}
.input-row .currency-symbol {
  font-size: 22px; font-weight: 600; color: #8e8e93;
}
.input-row input {
  flex: 1; border: none; background: transparent;
  font-size: 22px; font-weight: 600; color: #1d1d1f;
  outline: none; min-width: 0;
}
.input-row input::placeholder { color: #c7c7cc; font-weight: 400; }
.input-row .btn-add {
  width: 48px; height: 48px; border-radius: 50%; border: none;
  background: #007aff; color: #fff; font-size: 24px;
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s;
}
.input-row .btn-add:active { transform: scale(0.92); }
.input-row .btn-add:disabled { background: #c7c7cc; }

.input-hint {
  margin-top: 10px; display: flex; align-items: center; gap: 8px;
  font-size: 14px; color: #8e8e93; min-height: 22px;
}
.input-hint .category-tag {
  display: inline-flex; align-items: center; gap: 4px;
  background: #e8f0fe; color: #007aff; border-radius: 12px;
  padding: 2px 10px; font-size: 13px; font-weight: 500;
}

/* Category Selector (modal-like inline) */
.category-selector {
  display: none; margin-top: 12px; padding-top: 12px;
  border-top: 1px solid #e9e9eb;
}
.category-selector.show { display: block; }
.category-selector .title { font-size: 13px; color: #8e8e93; margin-bottom: 8px; }
.category-selector .grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
}
.category-selector .grid .cat-btn {
  padding: 10px 4px; border: 1px solid #e9e9eb; border-radius: 12px;
  background: #fff; font-size: 13px; cursor: pointer;
  text-align: center; transition: 0.15s;
}
.category-selector .grid .cat-btn:active { background: #f2f2f7; transform: scale(0.96); }
.category-selector .grid .cat-btn .emoji { display: block; font-size: 20px; margin-bottom: 2px; }

/* ===== Records List ===== */
.records-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.records-header h2 { font-size: 16px; font-weight: 600; }
.records-header .date-label { font-size: 13px; color: #8e8e93; }

.record-item {
  display: flex; align-items: center; padding: 12px 0;
  border-bottom: 1px solid #f2f2f7;
  -webkit-tap-highlight-color: transparent;
}
.record-item:last-child { border-bottom: none; }
.record-item .cat-icon {
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0; margin-right: 12px;
}
.record-item .info { flex: 1; min-width: 0; }
.record-item .info .note {
  font-size: 15px; font-weight: 500; color: #1d1d1f;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.record-item .info .meta {
  font-size: 12px; color: #8e8e93; margin-top: 2px;
}
.record-item .amount {
  font-size: 17px; font-weight: 600; color: #1d1d1f;
  flex-shrink: 0; margin-left: 8px;
}
.record-item .btn-del {
  width: 32px; height: 32px; border: none; background: transparent;
  color: #c7c7cc; font-size: 16px; cursor: pointer; flex-shrink: 0;
  border-radius: 8px; opacity: 0;
  transition: opacity 0.2s;
}
.record-item .btn-del:active { background: #f2f2f7; color: #ff3b30; }
.record-item:hover .btn-del,
.record-item.show-del .btn-del { opacity: 1; }
@media (hover: none) {
  .record-item .btn-del { opacity: 1; }
}

.empty-state {
  text-align: center; padding: 48px 20px; color: #c7c7cc;
}
.empty-state .emoji-big { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 15px; }

/* ===== Date Filter ===== */
.date-filter {
  display: flex; gap: 6px; align-items: center;
  margin-bottom: 10px; flex-wrap: wrap;
}
.filter-btn {
  padding: 6px 12px; border: 1px solid #e9e9eb; border-radius: 16px;
  background: #fff; font-size: 13px; color: #1d1d1f;
  cursor: pointer; transition: 0.15s; flex-shrink: 0;
}
.filter-btn.active {
  background: #007aff; color: #fff; border-color: #007aff;
}
.filter-btn:active { transform: scale(0.96); }
.filter-date {
  padding: 5px 8px; border: 1px solid #e9e9eb; border-radius: 16px;
  font-size: 13px; color: #1d1d1f; background: #fff;
  flex-shrink: 0; max-width: 150px;
}
.records-summary {
  display: flex; justify-content: space-between; align-items: center;
  background: #f2f2f7; border-radius: 12px;
  padding: 10px 14px; margin-bottom: 6px; font-size: 13px; color: #8e8e93;
}
.records-summary .sum-strong { color: #1d1d1f; font-weight: 600; font-size: 15px; }
.records-count { font-size: 13px; color: #8e8e93; }

/* ===== History Section (legacy, hidden) ===== */
.history-toggle { display: none; }
.history-section { display: none; }

.history-date-header .date-sub {
  font-size: 12px; color: #c7c7cc;
}
.history-date-header .label {
  font-size: 14px; font-weight: 600; color: #1d1d1f;
}
.history-date-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 0 6px; margin-top: 4px;
}
.history-date-header .label {
  font-size: 14px; font-weight: 600; color: #1d1d1f;
  white-space: nowrap;
}
.history-date-header .date-sub {
  font-size: 12px; color: #c7c7cc;
}
.history-date-header .day-total {
  font-size: 13px; font-weight: 600; color: #1d1d1f;
  margin-left: auto;
}
.history-date-header .line {
  flex: 1; height: 1px; background: #e9e9eb;
}
.history-date-header:first-child { padding-top: 4px; }

/* ===== Report Page ===== */
.report-summary {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;
}
.report-card {
  background: #f2f2f7; border-radius: 16px; padding: 16px;
}
.report-card .label { font-size: 12px; color: #8e8e93; margin-bottom: 4px; }
.report-card .value { font-size: 24px; font-weight: 700; }
.report-card .change {
  font-size: 12px; margin-top: 4px;
}
.report-card .change.up { color: #ff3b30; }
.report-card .change.down { color: #34c759; }

.chart-container {
  background: #f2f2f7; border-radius: 16px; padding: 16px; margin-bottom: 20px;
}
.chart-container .chart-title {
  font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #1d1d1f;
}
.chart-wrapper { position: relative; height: 220px; }

.category-breakdown { margin-bottom: 20px; }
.category-breakdown .item {
  display: flex; align-items: center; padding: 10px 0;
  border-bottom: 1px solid #f2f2f7;
}
.category-breakdown .item:last-child { border-bottom: none; }
.category-breakdown .item .name { flex: 1; font-size: 14px; }
.category-breakdown .item .bar-wrap {
  flex: 2; height: 8px; background: #e9e9eb; border-radius: 4px;
  margin: 0 12px; overflow: hidden;
}
.category-breakdown .item .bar-fill {
  height: 100%; border-radius: 4px; transition: width 0.5s;
}
.category-breakdown .item .amount {
  font-size: 14px; font-weight: 600; width: 70px; text-align: right;
}

/* Month selector */
.month-selector {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  margin-bottom: 16px;
}
.month-selector button {
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: #f2f2f7; color: #007aff; font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.month-selector button:active { background: #e9e9eb; }
.month-selector .month-label {
  font-size: 16px; font-weight: 600; min-width: 120px; text-align: center;
}

/* ===== Search Page ===== */
.search-box {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.search-box input {
  flex: 1; padding: 12px 16px; border: none; border-radius: 12px;
  background: #f2f2f7; font-size: 16px; outline: none;
}
.search-filters {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
}
.search-filters select, .search-filters input[type="date"] {
  padding: 8px 12px; border: 1px solid #e9e9eb; border-radius: 10px;
  background: #fff; font-size: 13px; outline: none; color: #1d1d1f;
  flex: 1; min-width: 0;
}

/* ===== Budget Page ===== */
.budget-total-card {
  background: #007aff; border-radius: 16px; padding: 20px; color: #fff;
  margin-bottom: 20px;
}
.budget-total-card .label { font-size: 13px; opacity: 0.8; margin-bottom: 4px; }
.budget-total-card .value-row {
  display: flex; justify-content: space-between; align-items: baseline;
}
.budget-total-card .value-row .value { font-size: 28px; font-weight: 700; }
.budget-total-card .value-row .spent {
  font-size: 14px; opacity: 0.8;
}
.budget-total-card .bar {
  height: 6px; background: rgba(255,255,255,0.3); border-radius: 3px;
  margin-top: 12px; overflow: hidden;
}
.budget-total-card .bar-fill {
  height: 100%; background: #fff; border-radius: 3px;
  transition: width 0.5s;
}
.budget-total-card .bar-fill.warn { background: #ffd60a; }
.budget-total-card .bar-fill.danger { background: #ff3b30; }
.budget-total-card .hint { font-size: 12px; opacity: 0.7; margin-top: 8px; }

.budget-input-row {
  display: flex; gap: 8px; margin-bottom: 16px;
}
.budget-input-row input {
  flex: 1; padding: 12px 16px; border: 1px solid #e9e9eb; border-radius: 12px;
  font-size: 16px; outline: none;
}
.budget-input-row input:focus { border-color: #007aff; }
.budget-input-row button {
  padding: 12px 20px; border: none; border-radius: 12px;
  background: #007aff; color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer;
}
.budget-input-row button:active { opacity: 0.8; }

.budget-cat-list { margin-bottom: 20px; }
.budget-cat-item {
  display: flex; align-items: center; padding: 12px 0;
  border-bottom: 1px solid #f2f2f7;
}
.budget-cat-item:last-child { border-bottom: none; }
.budget-cat-item .info { flex: 1; }
.budget-cat-item .info .name { font-size: 15px; font-weight: 500; }
.budget-cat-item .info .spent-text {
  font-size: 12px; color: #8e8e93; margin-top: 2px;
}
.budget-cat-item .bar-wrap {
  width: 80px; height: 6px; background: #e9e9eb; border-radius: 3px;
  margin: 0 12px; overflow: hidden;
}
.budget-cat-item .bar-fill {
  height: 100%; border-radius: 3px; transition: width 0.5s;
}
.budget-cat-item .bar-fill.warn { background: #ffd60a; }
.budget-cat-item .bar-fill.danger { background: #ff3b30; }
.budget-cat-item .budget-input {
  width: 70px; padding: 6px 8px; border: 1px solid #e9e9eb;
  border-radius: 8px; font-size: 13px; text-align: right; outline: none;
}
.budget-cat-item .budget-input:focus { border-color: #007aff; }

/* ===== Settings Page ===== */
.settings-section {
  margin-bottom: 24px;
}
.settings-section .section-title {
  font-size: 14px; font-weight: 600; color: #8e8e93;
  margin-bottom: 12px; padding: 0 4px;
}
.settings-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 4px; border-bottom: 1px solid #f2f2f7;
}
.settings-item:last-child { border-bottom: none; }
.settings-item .left { display: flex; align-items: center; gap: 10px; flex: 1; }
.settings-item .left .icon { font-size: 16px; }
.settings-item .left .name { font-size: 15px; }
.settings-item .badge { font-size: 12px; color: #8e8e93; }
.settings-item button {
  padding: 6px 14px; border: none; border-radius: 8px;
  background: #ff3b30; color: #fff; font-size: 12px; cursor: pointer;
}
.settings-item button.edit-btn { background: #007aff; }
.settings-item button:active { opacity: 0.8; }

/* Rule edit dialog */
.rule-edit-dialog {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4); z-index: 100;
  align-items: center; justify-content: center;
}
.rule-edit-dialog.show { display: flex; }
.rule-edit-dialog .dialog-content {
  background: #fff; border-radius: 20px; padding: 24px;
  width: 85%; max-width: 380px;
}
.rule-edit-dialog .dialog-content h3 {
  font-size: 17px; font-weight: 600; margin-bottom: 16px;
}
.rule-edit-dialog .dialog-content .field {
  margin-bottom: 12px;
}
.rule-edit-dialog .dialog-content .field label {
  display: block; font-size: 13px; color: #8e8e93; margin-bottom: 4px;
}
.rule-edit-dialog .dialog-content .field input,
.rule-edit-dialog .dialog-content .field select {
  width: 100%; padding: 10px 12px; border: 1px solid #e9e9eb;
  border-radius: 10px; font-size: 15px; outline: none;
}
.rule-edit-dialog .dialog-content .field select { background: #fff; }
.rule-edit-dialog .dialog-btns {
  display: flex; gap: 8px; margin-top: 20px;
}
.rule-edit-dialog .dialog-btns button {
  flex: 1; padding: 12px; border-radius: 12px; border: none;
  font-size: 15px; font-weight: 600; cursor: pointer;
}
.rule-edit-dialog .dialog-btns .btn-cancel {
  background: #f2f2f7; color: #1d1d1f;
}
.rule-edit-dialog .dialog-btns .btn-confirm {
  background: #007aff; color: #fff;
}
.rule-edit-dialog .dialog-btns button:active { opacity: 0.8; }

/* ===== Toast ===== */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px;
  border-radius: 20px; font-size: 14px; z-index: 200;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
  max-width: 85%; text-align: center;
}
.toast.show { opacity: 1; }

/* ===== Bottom Tab ===== */
.tab-bar {
  display: flex; flex-shrink: 0;
  border-top: 1px solid #e9e9eb; background: #fff; padding: 6px 0 env(safe-area-inset-bottom, 6px) 0;
}
.tab-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 6px 0; border: none; background: none;
  font-size: 10px; color: #8e8e93; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tab-item .tab-icon { font-size: 22px; line-height: 1; }
.tab-item.active { color: #007aff; }
.tab-item:active { opacity: 0.6; }

/* ===== Scrollbar ===== */
.main::-webkit-scrollbar { width: 0; }

/* ===== Responsive ===== */
@media (min-width: 480px) {
  .app { border-radius: 20px; margin-top: 20px; height: calc(100% - 40px); }
  body { background: #e9e9eb; }
}
</style>
</head>
<body>

<div class="app" id="app">

  <!-- Header -->
  <div class="header" id="header">
    <div class="header-top">
      <h1>💰 记账小管家</h1>
      <span class="header-month" id="headerMonth">2026年7月</span>
    </div>
    <div class="header-summary" id="headerSummary">
      <div class="stat-item">
        <div class="stat-label">本月支出</div>
        <div class="stat-value" id="totalMonth">0.00</div>
        <div class="stat-sub" id="totalChange"></div>
      </div>
      <div class="stat-item">
        <div class="stat-label">日均</div>
        <div class="stat-value" id="dailyAvg">0.00</div>
        <div class="stat-sub" id="totalDays"></div>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="main" id="main">

    <!-- Page 1: 记账 -->
    <div class="page active" id="pageAccount">
      <div class="input-area">
        <div class="input-row">
          <span class="currency-symbol">¥</span>
          <input type="text" id="inputField" placeholder="金额 用途" inputmode="text" autocomplete="off">
          <button class="btn-add" id="btnAdd" disabled>+</button>
        </div>
        <div class="input-hint" id="inputHint">
          <span>输入金额和用途，如「9.9 咖啡」</span>
        </div>
        <div class="category-selector" id="categorySelector">
          <div class="title">未识别用途，请选择分类：</div>
          <div class="grid" id="catGrid"></div>
        </div>
      </div>
      <div class="records-header">
        <h2>全部记录</h2>
        <span class="records-count" id="recordsCount"></span>
      </div>
      <div class="date-filter" id="dateFilter">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="today">今天</button>
        <button class="filter-btn" data-filter="yesterday">昨天</button>
        <button class="filter-btn" data-filter="week">本周</button>
        <button class="filter-btn" data-filter="month">本月</button>
        <input type="date" class="filter-date" id="filterDate" title="按日期查看">
      </div>
      <div class="records-summary" id="recordsSummary"></div>
      <div id="recordsList"></div>
    </div>

    <!-- Page 2: 月报 -->
    <div class="page" id="pageReport">
      <div class="month-selector">
        <button id="reportPrev">‹</button>
        <span class="month-label" id="reportMonthLabel">2026年7月</span>
        <button id="reportNext">›</button>
      </div>
      <div class="report-summary">
        <div class="report-card">
          <div class="label">总支出</div>
          <div class="value" id="reportTotal">¥0</div>
          <div class="change" id="reportTotalChange"></div>
        </div>
        <div class="report-card">
          <div class="label">日均支出</div>
          <div class="value" id="reportDaily">¥0</div>
          <div class="change" id="reportDays"></div>
        </div>
      </div>
      <div class="chart-container">
        <div class="chart-title">分类占比</div>
        <div class="chart-wrapper">
          <canvas id="pieChart"></canvas>
        </div>
      </div>
      <div class="category-breakdown" id="catBreakdown"></div>
    </div>

    <!-- Page 3: 搜索 -->
    <div class="page" id="pageSearch">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索用途..." inputmode="search">
      </div>
      <div class="search-filters">
        <select id="searchCat">
          <option value="">全部分类</option>
        </select>
        <input type="date" id="searchDateFrom">
        <input type="date" id="searchDateTo">
        <button style="padding:8px 16px;border:none;border-radius:10px;background:#007aff;color:#fff;font-size:13px;cursor:pointer" id="searchBtn">搜索</button>
      </div>
      <div id="searchResults"></div>
    </div>

    <!-- Page 4: 预算 -->
    <div class="page" id="pageBudget">
      <div class="budget-total-card" id="budgetTotalCard">
        <div class="label">月总预算</div>
        <div class="value-row">
          <span class="value" id="budgetTotalValue">未设置</span>
          <span class="spent" id="budgetTotalSpent">已用 ¥0</span>
        </div>
        <div class="bar"><div class="bar-fill" id="budgetTotalBar" style="width:0%"></div></div>
        <div class="hint" id="budgetTotalHint">点击下方编辑按钮设置月预算</div>
      </div>
      <div class="budget-input-row">

<script>
// ===== Configuration =====
const CATEGORIES = [

const DEFAULT_RULES = {
  '咖啡': '餐饮', '奶茶': '餐饮', '水': '餐饮', '饮料': '餐饮',
  '饭': '餐饮', '餐': '餐饮', '吃': '餐饮', '外卖': '餐饮',
  '食堂': '餐饮', '面': '餐饮', '早': '餐饮', '午': '餐饮',
  '晚': '餐饮', '夜宵': '餐饮', '酒': '餐饮', '水果': '餐饮',
  '零食': '餐饮', '面包': '餐饮',
  '地铁': '交通', '公交': '交通', '打车': '交通', '滴滴': '交通',
  '加油': '交通', '停车': '交通', '共享': '交通',
  '买': '购物', '衣服': '购物', '鞋': '购物', '包': '购物',
  '数码': '购物', '京东': '购物', '淘宝': '购物', '快递': '购物',
  '超市': '购物',
  '游戏': '娱乐', '电影': '娱乐', '会员': '娱乐', 'Steam': '娱乐',
  '氪金': '娱乐', '剧本杀': '娱乐', '电玩': '娱乐', '教父': '娱乐',
  '唱': '娱乐',
  '水电': '日用', '电费': '日用', '房租': '日用', '话费': '日用',
  '网费': '日用', '日用品': '日用',
  '药': '医疗', '医院': '医疗', '看病': '医疗', '体检': '医疗',
  '牙': '医疗',
  '书': '学习', '课程': '学习', '培训': '学习', '考试': '学习',
  '课': '学习', '学': '学习',
};

// Category colors
const CAT_COLORS = {
  '餐饮': '#ff9500', '交通': '#007aff', '购物': '#ff2d55',
  '娱乐': '#af52de', '日用': '#34c759', '医疗': '#ff3b30',
  '学习': '#5ac8fa', '其他': '#8e8e93',
};

// ===== Data Management =====
function emptyData() {
  return {
    records: [],
    rules: {},
    ruleTs: {},        // 规则最后修改时间 { 关键词: ts }
    ruleDel: {},       // 规则删除墓碑 { 关键词: ts }
    budget: { total: 0, categories: {} },
    budgetTs: 0,       // 预算最后修改时间
    deleted: {},       // 记录删除墓碑 { id: ts }
  };
}

function loadData() {
  let d = null;
  try {
    const raw = localStorage.getItem('acc_data');
    if (raw) d = JSON.parse(raw);
  } catch(e) {}
  if (!d || typeof d !== 'object') d = emptyData();
  // 兼容旧数据：补齐云同步所需字段
  const base = emptyData();
  for (const k in base) {
    if (d[k] === undefined || d[k] === null) d[k] = base[k];
  }
  if (!d.budget || typeof d.budget !== 'object') d.budget = { total: 0, categories: {} };
  if (!d.budget.categories) d.budget.categories = {};
  return d;
}

// 只写本地存储（同步合并时用，不触发上传）
function persistLocal() {
  localStorage.setItem('acc_data', JSON.stringify(data));
}

function saveData() {
  persistLocal();
  scheduleSync();
}

const data = loadData();

// Merge default rules if empty
if (Object.keys(data.rules).length === 0) {
  for (const k in DEFAULT_RULES) { data.rules[k] = DEFAULT_RULES[k]; data.ruleTs[k] = 0; }
  persistLocal();
}

// ===== 云同步 · 配置（GitHub Gist）=====
const SYNC_CFG_KEY = 'acc_sync';
const GIST_FILE = 'accounting-data.json';
const GIST_API = 'https://api.github.com/gists';
const SYNC_DEBOUNCE = 3000;

let syncCfg = loadSyncCfg();
let syncTimer = null;
let syncBusy = false;

function loadSyncCfg() {
  try {
    const raw = localStorage.getItem(SYNC_CFG_KEY);
    if (raw) {
      const c = JSON.parse(raw);
      if (typeof c.auto !== 'boolean') c.auto = true;
      return c;
    }
  } catch (e) {}
  return { token: '', gistId: '', auto: true, lastSync: 0 };
}

function saveSyncCfg() {
  localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(syncCfg));
}

function syncConfigured() { return !!syncCfg.token; }

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  return Math.floor(s / 86400) + ' 天前';
}

function syncStatusText() {
  if (!syncCfg.token) return '未配置 · 数据只在本机';
  if (!syncCfg.lastSync) return '已配置 · 等待首次同步';
  return '已同步 · ' + timeAgo(syncCfg.lastSync) + (syncCfg.auto ? ' · 自动同步开' : ' · 自动同步关');
}

function updateSyncUI() {
  const el = document.getElementById('syncStatus');
  if (el) el.textContent = syncStatusText();
  const t = document.getElementById('syncToken');
  if (t && document.activeElement !== t) t.value = syncCfg.token;
  const a = document.getElementById('syncAuto');
  if (a) a.checked = !!syncCfg.auto;
}

function scheduleSync() {
  if (!syncConfigured() || !syncCfg.auto) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function () { syncNow(false); }, SYNC_DEBOUNCE);
}

// ===== 云同步 · 数据合并 =====
function buildPayload() {
  return {
    v: 1,
    app: 'accounting-app',
    syncedAt: Date.now(),
    records: data.records,
    deleted: data.deleted,
    rules: data.rules,
    ruleTs: data.ruleTs,
    ruleDel: data.ruleDel,
    budget: data.budget,
    budgetTs: data.budgetTs,
  };
}

function mergeData(local, remote) {
  const out = emptyData();

  // 墓碑：取较大的时间
  const del = {};
  [local.deleted, remote.deleted].forEach(function (m) {
    if (!m) return;
    for (const k in m) del[k] = Math.max(del[k] || 0, m[k]);
  });
  const ruleDel = {};
  [local.ruleDel, remote.ruleDel].forEach(function (m) {
    if (!m) return;
    for (const k in m) ruleDel[k] = Math.max(ruleDel[k] || 0, m[k]);
  });

  // 记录：按 id 取更新时间较新的那条
  const byId = {};
  function addRec(r) {
    if (!r || !r.id) return;
    const t = r._u || r.timestamp || 0;
    const prev = byId[r.id];
    const pt = prev ? (prev._u || prev.timestamp || 0) : -1;
    if (!prev || t > pt) byId[r.id] = r;
  }
  (local.records || []).forEach(addRec);
  (remote.records || []).forEach(addRec);
  out.records = Object.keys(byId).map(function (k) { return byId[k]; })
    .filter(function (r) {
      const t = del[r.id];
      return !(t && (r._u || r.timestamp || 0) <= t);
    })
    .sort(function (a, b) { return (a.timestamp || 0) - (b.timestamp || 0); });

  // 规则：按关键词取较新
  function addRules(rules, ts) {
    rules = rules || {};
    for (const k in rules) {
      const t = (ts && ts[k]) || 0;
      const cur = out.ruleTs[k];
      if (cur === undefined || t > cur) {
        out.rules[k] = rules[k];
        out.ruleTs[k] = t;
      }
    }
  }
  addRules(local.rules, local.ruleTs);
  addRules(remote.rules, remote.ruleTs);
  for (const k in out.rules) {
    if (ruleDel[k] !== undefined) delete out.rules[k];
  }

  // 预算：整体按时间取新
  const lb = local.budgetTs || 0;
  const rb = remote.budgetTs || 0;
  if (rb > lb && remote.budget) {
    out.budget = remote.budget;
    out.budgetTs = rb;
  } else if (local.budget) {
    out.budget = local.budget;
    out.budgetTs = lb;
  }
  if (!out.budget.categories) out.budget.categories = {};

  out.deleted = del;
  out.ruleDel = ruleDel;
  return out;
}

function applyMerged(m) {
  data.records = m.records;
  data.deleted = m.deleted;
  data.rules = m.rules;
  data.ruleTs = m.ruleTs;
  data.ruleDel = m.ruleDel;
  data.budget = m.budget;
  data.budgetTs = m.budgetTs;
  persistLocal();
}

// 指纹：用于判断同步后本地数据是否真的变了
function fpOf(m) {
  const ids = (m.records || []).map(function (r) { return r.id; }).sort().join(',');
  return ids + '|' + (m.records || []).length + '|' + Object.keys(m.rules || {}).length +
    '|' + (m.budgetTs || 0) + '|' + Object.keys(m.deleted || {}).length +
    '|' + Object.keys(m.ruleDel || {}).length;
}

// ===== 云同步 · Gist 读写 =====
function gistHeaders() {
  return {
    'Authorization': 'Bearer ' + syncCfg.token,
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json',
  };
}

async function gistCall(url, method, body) {
  const res = await fetch(url, {
    method: method || 'GET',
    headers: gistHeaders(),
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let hint = 'HTTP ' + res.status;
    if (res.status === 401) hint = 'Token 无效或已过期';
    else if (res.status === 403) hint = 'Token 权限不足（需要 Gists 读写）';
    else if (res.status === 404) hint = 'Gist 不存在（可能被删了）';
    throw new Error(hint);
  }
  return res.json();
}

async function ensureGist() {
  if (syncCfg.gistId) return syncCfg.gistId;
  const list = await gistCall(GIST_API + '?per_page=100');
  let found = null;
  (list || []).forEach(function (g) {
    if (!found && g.files && g.files[GIST_FILE]) found = g;
  });
  if (found) {
    syncCfg.gistId = found.id;
    saveSyncCfg();
    return found.id;
  }
  const files = {};
  files[GIST_FILE] = { content: JSON.stringify(buildPayload()) };
  const created = await gistCall(GIST_API, 'POST', {
    description: '记账小管家 · 云同步（请勿删除）',
    public: false,
    files: files,
  });
  syncCfg.gistId = created.id;
  saveSyncCfg();
  return created.id;
}

async function fetchRemote() {
  const id = await ensureGist();
  const g = await gistCall(GIST_API + '/' + id + '?t=' + Date.now());
  const f = g.files && g.files[GIST_FILE];
  if (!f) return null;
  let content = f.content;
  if (f.truncated && f.raw_url) {
    try {
      const r = await fetch(f.raw_url);
      content = await r.text();
    } catch (e) {}
  }
  try { return JSON.parse(content); } catch (e) { return null; }
}

async function pushRemote() {
  const id = await ensureGist();
  const files = {};
  files[GIST_FILE] = { content: JSON.stringify(buildPayload()) };
  await gistCall(GIST_API + '/' + id, 'PATCH', { files: files });
}

// ===== 云同步 · 主流程 =====
async function syncNow(manual) {
  if (syncBusy) return;
  if (!syncConfigured()) {
    if (manual) showToast('请先填入 Token 并保存');
    return;
  }
  syncBusy = true;
  if (manual) showToast('同步中…');
  try {
    const remote = await fetchRemote();
    let changed = false;
    if (remote && remote.app === 'accounting-app') {
      const before = fpOf(data);
      const merged = mergeData(data, remote);
      if (fpOf(merged) !== before) changed = true;
      applyMerged(merged);
    }
    await pushRemote();
    syncCfg.lastSync = Date.now();
    saveSyncCfg();
    if (changed) refreshAll();
    if (manual) showToast('同步完成 ✓');
  } catch (e) {
    if (manual) showToast('同步失败：' + e.message);
    else console.warn('sync failed:', e);
  } finally {
    syncBusy = false;
    updateSyncUI();
  }
}

function initSync() {
  const t = document.getElementById('syncToken');
  if (!t) return;
  t.value = syncCfg.token;
  document.getElementById('syncAuto').checked = !!syncCfg.auto;

  document.getElementById('syncSaveBtn').onclick = async function () {
    const val = t.value.trim();
    if (!val) { showToast('请先填入 GitHub Token'); return; }
    const old = syncCfg.token;
    syncCfg.token = val;
    if (old !== val) { syncCfg.gistId = ''; syncCfg.lastSync = 0; }
    saveSyncCfg();
    updateSyncUI();
    await syncNow(true);
  };

  document.getElementById('syncNowBtn').onclick = function () { syncNow(true); };

  document.getElementById('syncOffBtn').onclick = function () {
    if (!confirm('关闭云同步？本机数据会保留，但不再与其他设备同步。')) return;
    syncCfg = { token: '', gistId: '', auto: true, lastSync: 0 };
    saveSyncCfg();
    t.value = '';
    updateSyncUI();
    showToast('已关闭云同步');
  };

  document.getElementById('syncAuto').onchange = function () {
    syncCfg.auto = this.checked;
    saveSyncCfg();
    updateSyncUI();
    if (syncCfg.auto) scheduleSync();
  };

  updateSyncUI();
}

// 切回前台时拉取一次
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && syncConfigured() && syncCfg.auto) syncNow(false);
});

// ===== Utility Functions =====
function getNow() {
  const d = new Date();
  return {
    date: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'),
    year: d.getFullYear(),
    month: d.getMonth() + 1,
    day: d.getDate(),
    timestamp: d.getTime(),
  };
}

function formatDate(dateStr) {
  const parts = dateStr.split('-');
  return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
}

function formatDateShort(dateStr) {
  const parts = dateStr.split('-');
  return parseInt(parts[1]) + '/' + parseInt(parts[2]);
}

function daysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

function getMonthKey(year, month) {
  return year + '-' + String(month).padStart(2, '0');
}

function catIcon(name) {
  const c = CATEGORIES.find(x => x.name === name);
  return c ? c.icon : '🤷';
}

function catColor(name) {
  return CAT_COLORS[name] || '#8e8e93';
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

// ===== 规则助手（带时间戳，便于跨设备合并）=====
function setRule(keyword, cat) {
  data.rules[keyword] = cat;
  data.ruleTs[keyword] = Date.now();
  delete data.ruleDel[keyword];
}

// ===== Auto Classification =====
function classify(note) {
  const trimmed = note.trim();
  // Exact match
  if (data.rules[trimmed]) return data.rules[trimmed];
  // Contains match (sorted by key length desc for longest match first)
  const keys = Object.keys(data.rules).sort((a, b) => b.length - a.length);
  for (const key of keys) {
    if (trimmed.includes(key)) return data.rules[key];
  }
  return null; // Not found
}

// ===== Parse Input =====
function parseInput(text) {
  // Support space, Chinese/English comma, Chinese pause mark as separator
  const match = text.trim().match(/^(\d+\.?\d*)[\s\uff0c,、]+(.+)$/);
  if (!match) return null;
  return {
    amount: parseFloat(match[1]),
    note: match[2].trim(),
  };
}

// ===== Toast =====
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ===== Budget Check =====
function getMonthSpending(year, month) {
  const prefix = getMonthKey(year, month);
  const monthRecords = data.records.filter(r => r.date.startsWith(prefix));
  let total = 0;
  const byCat = {};
  monthRecords.forEach(r => {
    total += r.amount;
    byCat[r.category] = (byCat[r.category] || 0) + r.amount;
  });
  return { total, byCat, count: monthRecords.length };
}

function checkBudget(year, month) {
  const { total, byCat } = getMonthSpending(year, month);
  const warnings = [];
  if (data.budget.total > 0 && total > data.budget.total) {
    warnings.push('月总预算超支！已用 ¥' + total.toFixed(2) + '，预算 ¥' + data.budget.total);
  }
  for (const [cat, limit] of Object.entries(data.budget.categories)) {
    if (limit > 0 && (byCat[cat] || 0) > limit) {
      warnings.push(cat + '预算超支！已用 ¥' + (byCat[cat] || 0).toFixed(2) + '，预算 ¥' + limit);
    }
  }
  return warnings;
}

// ===== Render Functions =====

// Update header
function updateHeader() {
  const now = getNow();
  document.getElementById('headerMonth').textContent = now.year + '年' + now.month + '月';
  const { total, byCat } = getMonthSpending(now.year, now.month);

  // Last month comparison
  let lastMonthYear = now.year;
  let lastMonth = now.month - 1;
  if (lastMonth === 0) { lastMonth = 12; lastMonthYear--; }
  const last = getMonthSpending(lastMonthYear, lastMonth);
  const totalEl = document.getElementById('totalMonth');
  totalEl.textContent = '¥' + total.toFixed(2);
  totalEl.className = total > 0 ? 'stat-value' : 'stat-value';
  if (data.budget.total > 0 && total > data.budget.total) {
    totalEl.classList.add('warn');
  }

  const changeEl = document.getElementById('totalChange');
  if (last.total > 0) {
    const diff = total - last.total;
    const pct = ((diff / last.total) * 100).toFixed(1);
    changeEl.textContent = (diff >= 0 ? '↑' : '↓') + ' ' + Math.abs(diff).toFixed(0) + ' (' + (diff >= 0 ? '+' : '') + pct + '%)';
    changeEl.className = 'stat-sub' + (diff > 0 ? ' up' : ' down');
  } else {
    changeEl.textContent = '';
    changeEl.className = 'stat-sub';
  }

  const daysPassed = now.day;
  const daily = daysPassed > 0 ? total / daysPassed : 0;
  document.getElementById('dailyAvg').textContent = '¥' + daily.toFixed(2);
  document.getElementById('totalDays').textContent = '已过' + daysPassed + '天';
}

// ===== Record Filter State =====
let currentFilter = 'all';
let customDate = '';

// 筛选匹配
function recordMatchesFilter(r) {
  const now = getNow();
  if (currentFilter === 'today') return r.date === now.date;
  if (currentFilter === 'yesterday') {
    const y = new Date(now.timestamp - 86400000);
    const ys = y.getFullYear() + '-' + String(y.getMonth()+1).padStart(2,'0') + '-' + String(y.getDate()).padStart(2,'0');
    return r.date === ys;
  }
  if (currentFilter === 'week') {
    const d = new Date(r.date + 'T00:00:00');
    const nowD = new Date(now.date + 'T00:00:00');
    const day = (nowD.getDay() + 6) % 7; // 周一为0
    const weekStart = new Date(nowD.getTime() - day * 86400000);
    return d >= weekStart && d <= nowD;
  }
  if (currentFilter === 'month') return r.date.startsWith(now.date.slice(0, 7));
  if (currentFilter === 'custom' && customDate) return r.date === customDate;
  return true; // all
}

// 日期分组标题
function dateGroupLabel(dateStr) {
  const now = getNow();
  if (dateStr === now.date) return '今天';
  const y = new Date(now.timestamp - 86400000);
  const ys = y.getFullYear() + '-' + String(y.getMonth()+1).padStart(2,'0') + '-' + String(y.getDate()).padStart(2,'0');
  if (dateStr === ys) return '昨天';
  const parts = dateStr.split('-');
  return parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
}

// Render records list (全部记录，按日期分组)
function renderRecords() {
  const el = document.getElementById('recordsList');
  const filtered = data.records.filter(recordMatchesFilter)
    .sort((a, b) => b.timestamp - a.timestamp);

  // 统计概览
  const total = filtered.reduce((s, r) => s + r.amount, 0);
  document.getElementById('recordsCount').textContent = filtered.length + '笔';
  const summaryEl = document.getElementById('recordsSummary');
  summaryEl.innerHTML = '<span>共 <span class="sum-strong">' + filtered.length + '</span> 笔</span><span>合计 <span class="sum-strong">¥' + total.toFixed(2) + '</span></span>';

  if (filtered.length === 0) {
    const msgs = {
      'all': '还没有任何记录，记一笔吧！',
      'today': '今天还没花钱呢，真棒！',
      'yesterday': '昨天没有记录',
      'week': '本周还没有记录',
      'month': '本月还没有记录',
      'custom': '这一天没有记录',
    };
    el.innerHTML = '<div class="empty-state"><div class="emoji-big">📭</div><p>' + (msgs[currentFilter] || msgs.all) + '</p></div>';
    return;
  }

  // 按日期分组
  const groups = {};
  filtered.forEach(r => {
    if (!groups[r.date]) groups[r.date] = [];
    groups[r.date].push(r);
  });
  const dates = Object.keys(groups).sort().reverse();

  el.innerHTML = dates.map(date => {
    const records = groups[date];
    const dayTotal = records.reduce((s, r) => s + r.amount, 0);
    const recordsHtml = records.map(r => `
      <div class="record-item">
        <div class="cat-icon" style="background:${catColor(r.category)}20;color:${catColor(r.category)}">${catIcon(r.category)}</div>
        <div class="info">
          <div class="note">${escapeHtml(r.note)}</div>
          <div class="meta">${r.category}</div>
        </div>
        <div class="amount">¥${r.amount.toFixed(2)}</div>
        <button class="btn-del" onclick="deleteRecord('${r.id}')">✕</button>
      </div>
    `).join('');

    return `
      <div class="history-date-header">
        <span class="label">${dateGroupLabel(date)}</span>
        <span class="date-sub">${date}</span>
        <span class="line"></span>
        <span class="day-total">¥${dayTotal.toFixed(2)}</span>
      </div>
      ${recordsHtml}`;
  }).join('');
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function renderReport() {
  document.getElementById('reportMonthLabel').textContent = reportYear + '年' + reportMonth + '月';

    changeEl.textContent = (diff >= 0 ? '↑' : '↓') + ' 较上月 ' + Math.abs(diff).toFixed(0) + '元 (' + (diff >= 0 ? '+' : '') + pct + '%)';
    changeEl.className = 'change' + (diff > 0 ? ' up' : ' down');
  } else if (spending.total > 0) {
    changeEl.textContent = '上月无支出';
    changeEl.className = 'change';
  } else {
    changeEl.textContent = '';
    changeEl.className = 'change';
  }

  // Pie chart
  renderPieChart(spending.byCat);

  // Category breakdown

}

function renderPieChart(byCat) {
  const canvas = document.getElementById('pieChart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  const w = rect.width;
  const h = 220;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);

  ctx.clearRect(0, 0, w, h);

  const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  if (entries.length === 0) return;

  const total = entries.reduce((s, e) => s + e[1], 0);
  const cx = w * 0.35;
  const cy = h / 2;
  const radius = Math.min(80, cx - 10, cy - 10);
  const innerRatio = 0.55;

  // Draw doughnut
  let startAngle = -Math.PI / 2;
  entries.forEach(([cat, amount]) => {
    const sliceAngle = (amount / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startAngle, startAngle + sliceAngle);
    ctx.closePath();
    ctx.fillStyle = catColor(cat);
    ctx.fill();

    // Inner cutout (white circle)
    startAngle += sliceAngle;
  });

  // Draw inner white circle for doughnut effect
  ctx.beginPath();
  ctx.arc(cx, cy, radius * innerRatio, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  // Center text
  ctx.fillStyle = '#1d1d1f';
  ctx.font = 'bold 18px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('¥' + total.toFixed(0), cx, cy - 6);
  ctx.fillStyle = '#8e8e93';
  ctx.font = '11px -apple-system, sans-serif';
  ctx.fillText('总支出', cx, cy + 16);

  // Legend on the right
  const legendX = w * 0.6;
  let legendY = 30;
  const itemH = 24;
  const maxItems = Math.min(entries.length, Math.floor((h - 20) / itemH));
  entries.slice(0, maxItems).forEach(([cat, amount]) => {
    const pct = ((amount / total) * 100).toFixed(1);

    // Color dot
    ctx.beginPath();
    ctx.arc(legendX + 6, legendY + 8, 5, 0, Math.PI * 2);
    ctx.fillStyle = catColor(cat);
    ctx.fill();

    // Label
    ctx.fillStyle = '#1d1d1f';
    ctx.font = '12px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const label = catIcon(cat) + ' ' + cat;
    ctx.fillText(label, legendX + 16, legendY + 8);

    // Amount + pct
    ctx.fillStyle = '#8e8e93';
    ctx.font = '11px -apple-system, sans-serif';
    ctx.fillText('¥' + amount.toFixed(0) + ' (' + pct + '%)', legendX + 16, legendY + 24);

    legendY += itemH + 4;
  });
}

function renderCatBreakdown(byCat, total) {
  const el = document.getElementById('catBreakdown');
  const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  if (entries.length === 0) {
    el.innerHTML = '<div class="empty-state" style="padding:24px"><p>本月暂无支出</p></div>';
    return;
  }
  el.innerHTML = entries.map(([cat, amount]) => {
    const pct = total > 0 ? (amount / total * 100) : 0;
    return `
      <div class="item">
        <span class="name">${catIcon(cat)} ${cat}</span>
        <div class="bar-wrap">
          <div class="bar-fill" style="width:${pct}%;background:${catColor(cat)}"></div>
        </div>
        <span class="amount">¥${amount.toFixed(2)}</span>
      </div>
    `;
  }).join('');
}

function initSearch() {

function doSearch() {
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const cat = document.getElementById('searchCat').value;
  const dateFrom = document.getElementById('searchDateFrom').value;
  const dateTo = document.getElementById('searchDateTo').value;

  let results = [...data.records];

  if (keyword) {
    results = results.filter(r => r.note.toLowerCase().includes(keyword));
  }
  if (cat) {
    results = results.filter(r => r.category === cat);
  }
  if (dateFrom) {
    results = results.filter(r => r.date >= dateFrom);
  }
  if (dateTo) {
    results = results.filter(r => r.date <= dateTo);
  }

  const el = document.getElementById('searchResults');
  if (results.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emoji-big">🔍</div><p>没有找到匹配的记录</p></div>';
  } else {
    el.innerHTML = '<div style="font-size:13px;color:#8e8e93;margin-bottom:8px">找到 ' + results.length + ' 条记录</div>' +
      renderFullRecords(results);

function initBudget() {

      showToast('请输入有效金额');

function renderBudget() {
  const now = getNow();
  const { total, byCat } = getMonthSpending(now.year, now.month);

  // Total budget
  const valueEl = document.getElementById('budgetTotalValue');
  const spentEl = document.getElementById('budgetTotalSpent');
  const barEl = document.getElementById('budgetTotalBar');
  const hintEl = document.getElementById('budgetTotalHint');

  if (data.budget.total > 0) {
    valueEl.textContent = '¥' + data.budget.total;
    spentEl.textContent = '已用 ¥' + total.toFixed(2);
    const pct = Math.min(100, (total / data.budget.total) * 100);
    barEl.style.width = pct + '%';
    barEl.className = 'bar-fill' + (pct >= 100 ? ' danger' : pct >= 80 ? ' warn' : '');
    const remain = Math.max(0, data.budget.total - total);
    hintEl.textContent = '剩余 ¥' + remain.toFixed(2) + (remain > 0 ? '，日均还剩 ¥' + (remain / Math.max(1, daysInMonth(now.year, now.month) - now.day)).toFixed(2) : '，已超支！');
  } else {
    valueEl.textContent = '未设置';
    spentEl.textContent = '已用 ¥' + total.toFixed(2);
    barEl.style.width = '0%';
    barEl.className = 'bar-fill';
    hintEl.textContent = '点击下方编辑按钮设置月预算';
  }

  // Category budget list
  const listEl = document.getElementById('budgetCatList');
  listEl.innerHTML = CATEGORIES.map(c => {
    const spent = byCat[c.name] || 0;
    const limit = data.budget.categories[c.name] || 0;
    const pct = limit > 0 ? Math.min(100, (spent / limit) * 100) : 0;
    const warnClass = pct >= 100 ? 'danger' : pct >= 80 ? 'warn' : '';
    return `
      <div class="budget-cat-item">
        <div class="info">
          <div class="name">${c.icon} ${c.name}</div>
          <div class="spent-text">已用 ¥${spent.toFixed(2)}${limit > 0 ? ' / ¥' + limit : ''}</div>
        </div>
        ${limit > 0 ? `<div class="bar-wrap"><div class="bar-fill ${warnClass}" style="width:${pct}%;background:${catColor(c.name)}"></div></div>` : '<div style="width:80px"></div>'}
        <input class="budget-input" type="number" min="0" placeholder="0" value="${limit > 0 ? limit : ''}" data-cat="${c.name}" onchange="updateCatBudget(this)">
      </div>
    `;
  }).join('');
}

function updateCatBudget(input) {
  const cat = input.dataset.cat;
  const val = parseFloat(input.value);
  if (isNaN(val) || val <= 0) {
    delete data.budget.categories[cat];
  } else {
    data.budget.categories[cat] = val;
  }
  data.budgetTs = Date.now();
  saveData();
  renderBudget();
  showToast(cat + '预算已更新');
}

  showToast('已删除');
}

// Export CSV
document.getElementById('exportBtn').onclick = function() {
  if (data.records.length === 0) {
    showToast('暂无数据可导出');
    return;
  }
  const rows = [['日期', '金额', '用途', '分类', '时间戳']];
  data.records.sort((a, b) => a.timestamp - b.timestamp).forEach(r => {
    rows.push([r.date, r.amount, r.note, r.category, r.timestamp]);
  });
  const csv = rows.map(row => row.join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '记账_' + getNow().date + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出 CSV');
};

// Clear all
document.getElementById('clearAllBtn').onclick = function() {
  if (!confirm('确定清空全部数据？包括所有记录、规则和预算设置！此操作不可恢复！')) return;
  if (!confirm('再次确认：真的要清空全部数据吗？')) return;
  const stamp = Date.now();
  data.records.forEach(r => { data.deleted[r.id] = stamp; });
  data.records = [];
  for (const k in data.rules) data.ruleDel[k] = stamp;
  data.rules = {};
  data.ruleTs = {};
  for (const k in DEFAULT_RULES) { data.rules[k] = DEFAULT_RULES[k]; data.ruleTs[k] = stamp; }
  data.budget = { total: 0, categories: {} };
  data.budgetTs = stamp;
  saveData();
  refreshAll();
  showToast('全部数据已清空');
};

// ===== Tab Navigation =====
function initTabs() {
  const tabs = document.querySelectorAll('.tab-item');
  tabs.forEach(tab => {
    tab.addEventListener('click', function() {
      tabs.forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(this.dataset.page).classList.add('active');

      // Refresh report if switching to it
      if (this.dataset.page === 'pageReport') renderReport();
      if (this.dataset.page === 'pageBudget') renderBudget();
      // Scroll to top
      document.getElementById('main').scrollTop = 0;
    });
  });
}

// ===== Refresh All =====
function refreshAll() {
  updateHeader();
  renderRecords();
  renderBudget();
  if (document.getElementById('pageReport').classList.contains('active')) renderReport();
}

// ===== Date Filter Init =====
function initDateFilter() {
  const btns = document.querySelectorAll('.filter-btn');
  btns.forEach(btn => {
    btn.addEventListener('click', function() {
      btns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentFilter = this.dataset.filter;
      if (currentFilter !== 'custom') {
        customDate = '';
        document.getElementById('filterDate').value = '';
      }
      renderRecords();
    });
  });
  const dateInput = document.getElementById('filterDate');
  dateInput.addEventListener('change', function() {
    if (this.value) {
      currentFilter = 'custom';
      customDate = this.value;
      btns.forEach(b => b.classList.remove('active'));
      renderRecords();
    }
  });
}

// ===== Init =====
document.addEventListener('DOMContentLoaded', function() {
  initTabs();
  initDateFilter();
  initReport();
  initSearch();
  initBudget();
  setupRuleDialog();
  initSync();
  renderRules();
  refreshAll();
  updateHeader();

  // 已配置云同步：启动时静默拉取一次
  if (syncConfigured()) syncNow(false);

  // Focus input
  document.getElementById('inputField').focus();
});
</script>
